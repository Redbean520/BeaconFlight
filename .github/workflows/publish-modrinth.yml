name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Fabric
          - pattern: "*-1.20.x-fabric-*.jar"
            mc-version: "1.20.1"
            loader: "fabric"
          - pattern: "*-1.21.1-fabric-*.jar"
            mc-version: "1.21.1"
            loader: "fabric"
          - pattern: "*-1.21.11-fabric-*.jar"
            mc-version: "1.21.11"
            loader: "fabric"
          - pattern: "*-26.1-fabric-*.jar"
            mc-version: "26.1"
            loader: "fabric"
          - pattern: "*-26.2-fabric-*.jar"
            mc-version: "26.2"
            loader: "fabric"
          # NeoForge
          - pattern: "*-1.21.1-neoforge-*.jar"
            mc-version: "1.21.1"
            loader: "neoforge"
          - pattern: "*-1.21.11-neoforge-*.jar"
            mc-version: "1.21.11"
            loader: "neoforge"
          - pattern: "*-26.1-neoforge-*.jar"
            mc-version: "26.1"
            loader: "neoforge"
          - pattern: "*-26.2-neoforge-*.jar"
            mc-version: "26.2"
            loader: "neoforge"
          # Forge
          - pattern: "*-1.20.x-forge-*.jar"
            mc-version: "1.20.1"
            loader: "forge"

    steps:
      - name: Determine tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download jar from Release
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.vars.outputs.tag }}" \
            | jq -r '.assets[].browser_download_url' \
            | grep "${{ matrix.pattern }}" \
            | xargs -I{} curl -sSL -O {}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: redbean-beaconflight
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: "BeaconFlight ${{ steps.vars.outputs.tag }} for MC ${{ matrix.mc-version }} (${{ matrix.loader }})"
          version: "${{ steps.vars.outputs.version }}+mc${{ matrix.mc-version }}-${{ matrix.loader }}"
          version-type: release
          game-versions: ${{ matrix.mc-version }}
          loaders: ${{ matrix.loader }}
          files: "*${{ matrix.pattern }}"

          changelog: |
            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
            下载其他版本: [GitHub Releases](https://github.com/${{ github.repository }}/releases)
