name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Fabric
          - grep-regex: "beaconflight-1\\.20\\.x-fabric-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.20.x-fabric-*.jar"
            game-versions: "1.20.1, 1.20.2, 1.20.3, 1.20.4, 1.20.5, 1.20.6"
            version-suffix: "1.20.x"
            loader: "fabric"
          - grep-regex: "beaconflight-1\\.21\\.1-fabric-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.21.1-fabric-*.jar"
            game-versions: "1.21.1"
            version-suffix: "1.21.1"
            loader: "fabric"
          - grep-regex: "beaconflight-1\\.21\\.11-fabric-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.21.11-fabric-*.jar"
            game-versions: "1.21.11"
            version-suffix: "1.21.11"
            loader: "fabric"
          - grep-regex: "beaconflight-26\\.1-fabric-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-26.1-fabric-*.jar"
            game-versions: "26.1"
            version-suffix: "26.1"
            loader: "fabric"
          - grep-regex: "beaconflight-26\\.2-fabric-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-26.2-fabric-*.jar"
            game-versions: "26.2"
            version-suffix: "26.2"
            loader: "fabric"
          # NeoForge
          - grep-regex: "beaconflight-1\\.21\\.1-neoforge-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.21.1-neoforge-*.jar"
            game-versions: "1.21.1"
            version-suffix: "1.21.1"
            loader: "neoforge"
          - grep-regex: "beaconflight-1\\.21\\.11-neoforge-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.21.11-neoforge-*.jar"
            game-versions: "1.21.11"
            version-suffix: "1.21.11"
            loader: "neoforge"
          - grep-regex: "beaconflight-26\\.1-neoforge-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-26.1-neoforge-*.jar"
            game-versions: "26.1"
            version-suffix: "26.1"
            loader: "neoforge"
          - grep-regex: "beaconflight-26\\.2-neoforge-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-26.2-neoforge-*.jar"
            game-versions: "26.2"
            version-suffix: "26.2"
            loader: "neoforge"
          # Forge
          - grep-regex: "beaconflight-1\\.20\\.x-forge-[0-9.]+(-sources)?\\.jar"
            file-glob: "beaconflight-1.20.x-forge-*.jar"
            game-versions: "1.20.1, 1.20.2, 1.20.3, 1.20.4, 1.20.5, 1.20.6"
            version-suffix: "1.20.x"
            loader: "forge"

    steps:
      - name: Determine tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download jar from Release
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.vars.outputs.tag }}" \
            | jq -r '.assets[].browser_download_url' \
            | grep -E "${{ matrix.grep-regex }}" \
            | grep -v '\-sources\.jar$' \
            | xargs -I{} curl -sSL -O {}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: redbean-beaconflight
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: "BeaconFlight ${{ steps.vars.outputs.tag }} for MC ${{ matrix.version-suffix }} (${{ matrix.loader }})"
          version: "${{ steps.vars.outputs.version }}+mc${{ matrix.version-suffix }}-${{ matrix.loader }}"
          version-type: release
          game-versions: ${{ matrix.game-versions }}
          loaders: ${{ matrix.loader }}
          files: ${{ matrix.file-glob }}

          changelog: |
            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
            下载其他版本: [GitHub Releases](https://github.com/${{ github.repository }}/releases)
